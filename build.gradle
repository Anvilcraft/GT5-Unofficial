buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "tilera"
            url = "https://maven.tilera.xyz"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath ('com.anatawa12.forge:ForgeGradle:1.2-1.0.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'
apply plugin: 'maven-publish'

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

version = "5.09.31"
group= "gregtech"
archivesBaseName = "gregtech"

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

repositories {
    maven { url = "https://maven.tilera.xyz" }
}

sourceSets {
    main {
        java {
            srcDirs = [
                'src/main/java'
            ]
        }
        resources {
            srcDirs = [
                'src/main/resources'
            ]
        }
    }
}

repositories {
    maven {
        url = "https://maven.tilera.xyz/"
    }
    maven {
        url = "https://s3.tilera.xyz/cdn/minecraft/libs/"
        metadataSources {
            artifact()
        }
    }
    maven {
        name = "ChickenBones"
        url = "http://chickenbones.net/maven"
    }
    maven {
		url "https://www.ryanliptak.com/maven/"
	}
}

dependencies {
    //implementation "net.industrial-craft:industrialcraft-2:2.2.827-experimental:deobf"
    implementation "mods:IC2Classic:1.7.10-1.2.6:deobf"

	implementation "appeng:Waila:1.5.10_1.7.10:api"
	implementation "codechicken:CodeChickenLib:1.7.10-1.1.3.140:dev"
	implementation "codechicken:CodeChickenCore:1.7.10-1.0.7.47:dev"
	implementation "codechicken:NotEnoughItems:1.7.10-1.0.5.120:dev"

	compileOnly "ender:EnderCore:1.7.10-0.2.0.39_beta:dev"
	compileOnly "ender:EnderIO:1.7.10-2.3.0.429_beta:dev"

	compileOnly "cofh:CoFHCore:[1.7.10]3.1.4-329:dev"
	compileOnly "cofh:CoFHLib:[1.7.10]1.2.1-185:dev"
	compileOnly "buildcraft:buildcraft:7.1.25:dev"
	compileOnly "mods:forestry_1.7.10:4.2.16.64"
	compileOnly "mods:Railcraft_1.7.10:9.12.2.0"

	compileOnly "mods:GalacticraftCore:1.7-3.0.12.504:deobf"
	compileOnly "mods:MicdoodleCore:1.7-3.0.12.504"

	compileOnly "thaumcraft:Thaumcraft:1.7.10-4.2.3.5:deobf"
	compileOnly "com.azanor.baubles:Baubles:1.7.10-1.0.1.10:deobf"
	compileOnly "appeng:appliedenergistics2:rv3-beta-26:dev"
	compileOnly "applecore:AppleCore:1.7.10-3.1.1:deobf"
	compileOnly "com.shedar.IC2NuclearControl:IC2NuclearControl:2.4.5a:dev"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    filesMatching('mcmod.info') {
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'deobf'
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allSource
    classifier = 'sources'
}

publishing {
    tasks.publish.dependsOn 'build'
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archivesBaseName

            artifact deobfJar
            artifact sourcesJar
            artifact jar
        }
    }

    repositories {
        if (project.hasProperty('mvnURL')) {
                maven {
                    credentials {
                        username findProperty("mvnUsername")
                        password findProperty("mvnPassword")
                    }
                    url = findProperty("mvnURL")
                }
        }
        else {
                mavenLocal()
        }
    }
}
